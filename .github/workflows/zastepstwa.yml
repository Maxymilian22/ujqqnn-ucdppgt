name: Skaner Zastępstw

on:
  schedule:
    - cron: '0 */5 * * *' # Lub inny harmonogram uruchamiania
  workflow_dispatch:

jobs:
  run-skaner:
    runs-on: ubuntu-latest
    
    # 1. WYMAGANE: Uprawnienia do zapisu w repozytorium przez GITHUB_TOKEN
    permissions:
      contents: write

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Utworzenie pustego pliku requirements.txt (dla skanera)
        run: touch requirements.txt

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalacja zależności
        run: |
          pip install httpx aiosqlite

      - name: Uruchomienie skryptu zastępstw
        # 2. WYMAGANE: Przekazanie tokenu i nazwy repozytorium do skryptu
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISCORD_WEBHOOK_URL_2: ${{ secrets.DISCORD_WEBHOOK_URL_2 }}
        run: python zastepstwa_bot.py
