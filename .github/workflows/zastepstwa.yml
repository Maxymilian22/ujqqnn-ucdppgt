name: Skaner Zastępstw

on:
#  schedule:
#    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-skaner:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Utworzenie pustego pliku requirements.txt (dla skanera)
        run: touch requirements.txt

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalacja zależności
        run: |
          pip install httpx "httpx[http2]" aiosqlite

      - name: Uruchomienie skryptu zastępstw
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISCORD_WEBHOOK_URL_2: ${{ secrets.DISCORD_WEBHOOK_URL_2 }}
        run: python zastepstwa_bot.py
